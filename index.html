<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 저녁 뭐 먹지? ㅋㅋㅋ</title>
    
    <style>
        /* 기본 폰트를 궁서체로 통일하여 진지하면서도 킹받게 설정 */
        body {
            font-family: '궁서', 'Gungsuh', serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            /* 눈 아픈 무지개 배경 애니메이션 */
            background: linear-gradient(124deg, #ff2400, #e81d1d, #e8b71d, #e3e81d, #1de840, #1ddde8, #2b1de8, #dd00f3, #dd00f3);
            background-size: 1800% 1800%;
            animation: rainbow 3s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        @keyframes rainbow { 
            0%{background-position:0% 82%}
            50%{background-position:100% 19%}
            100%{background-position:0% 82%}
        }

        /* 메인 화면 킹받는 박스 디자인 (형광 마젠타 + 형광 그린 점선) */
        #screen1 {
            background-color: #ff00ff;
            border: 15px dashed #00ff00;
            padding: 30px;
            box-shadow: 20px 20px 0px #00ffff;
            transform: rotate(-2deg);
        }

        h1 {
            color: yellow;
            text-shadow: 3px 3px 0 red, -3px -3px 0 blue;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .blink {
            animation: blinker 0.2s linear infinite;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

        /* 체크박스 영역 */
        .checkbox-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 20px 0;
            font-size: 1.5rem;
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 0 black;
        }

        .checkbox-container label {
            cursor: pointer;
            background: black;
            border: 5px solid yellow;
            padding: 10px;
        }

        /* 킹받는 버튼 */
        .shake-btn {
            background-color: red;
            color: yellow;
            font-family: '궁서';
            font-size: 2rem;
            font-weight: bold;
            padding: 20px 40px;
            border: 10px solid #000;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.8);
        }

        /* 마우스 올리면 발작하는 애니메이션 */
        .shake-btn:hover {
            animation: shake 0.1s infinite;
            background-color: yellow;
            color: red;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        #screen2 {
            display: none; /* 처음엔 숨김 */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
        }

        #gift-box {
            font-size: 150px;
            cursor: pointer;
            animation: heartbeat 0.5s infinite;
            user-select: none;
            transition: transform 0.2s;
        }

        #gift-box:active {
            transform: scale(0.8);
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.2) rotate(5deg); }
            100% { transform: scale(1); }
        }

        .guide-text {
            color: white;
            font-size: 2rem;
            text-shadow: 3px 3px 0 black;
            margin-top: 20px;
        }

        /* 결과 텍스트 (어그로 극대화) */
        #result-text {
            display: none;
            font-size: 4rem;
            color: #00ff00;
            text-shadow: -5px -5px 0 red, 5px -5px 0 red, -5px 5px 0 red, 5px 5px 0 red, 10px 10px 0 black;
            font-weight: bold;
            word-break: keep-all;
            padding: 20px;
        }

        .spin-zoom {
            animation: spinZoom 1.2s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes spinZoom {
            0% { transform: scale(0) rotate(-1080deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        /* 떨어지는 이모지 효과 */
        .confetti {
            position: fixed;
            top: -50px;
            font-size: 40px;
            animation: fall linear forwards;
            z-index: 999;
        }

        @keyframes fall {
            to { transform: translateY(120vh) rotate(720deg); }
        }

        /* 킹받는 커스텀 경고창 (alert 대체) */
        #custom-alert {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: yellow;
            border: 15px double red;
            padding: 40px;
            z-index: 10000;
            box-shadow: 0 0 0 1000px rgba(0,0,0,0.8);
        }
        #custom-alert h2 { color: red; font-size: 2rem; margin: 0 0 20px 0; }
        #custom-alert button { font-size: 1.5rem; padding: 10px 20px; cursor: pointer; background: black; color: white; border: none; font-family: '궁서'; }

    </style>
</head>
<body>

    <!-- 첫 번째 화면: 카테고리 선택 -->
    <div id="screen1">
        <h1><span class="blink">🌟초특급🌟</span><br>저녁 메뉴 추첨기 ㅋㅋㅋ</h1>
        <p style="color: white; font-size: 1.2rem; background: black; padding: 5px;">(먹고 싶은 거 체크하셈)</p>
        
        <div class="checkbox-container">
            <label><input type="checkbox" value="kr" checked> 🍚 한식</label>
            <label><input type="checkbox" value="we" checked> 🍝 양식</label>
            <label><input type="checkbox" value="cn" checked> 🥟 중식</label>
            <label><input type="checkbox" value="jp" checked> 🍣 일식</label>
            <label style="grid-column: span 2;"><input type="checkbox" value="etc" checked> 🌮 기타 (안 고르면 후회함)</label>
        </div>

        <button class="shake-btn" id="btn-recommend">메뉴 골라줘<br>(안누르면 평생 굶음)</button>
    </div>

    <!-- 두 번째 화면: 선물상자 (box.cyhuh.com 스타일) -->
    <div id="screen2">
        <div id="gift-box">🎁</div>
        <div class="guide-text" id="guide-text">박스를 냅다 클릭하셈 ㅋㅋ</div>
        <div id="result-text"></div>
    </div>

    <!-- 커스텀 경고창 -->
    <div id="custom-alert">
        <h2>아니 뭐라도 체크를 해야<br>고르지 장난함? ㅡㅡ</h2>
        <button onclick="document.getElementById('custom-alert').style.display='none'">아 ㅈㅅ;</button>
    </div>

    <script>
        // 메뉴 데이터 (요청하신 메뉴 완벽 반영)
        const menus = {
            kr: ["떡볶이", "김치찌개", "된장찌개", "부대찌개", "제육볶음", "국밥", "삼겹살", "곱창", "닭갈비", "찜닭", "비빔밥", "불고기", "감자탕", "뼈해장국", "육회"],
            we: ["파스타", "피자", "스테이크", "리조또", "햄버거"],
            cn: ["마라탕", "짜장면", "짬뽕", "탕수육", "볶음밥", "깐풍기", "양꼬치", "훠궈"],
            jp: ["초밥", "돈까스", "라멘", "우동", "규동", "소바", "텐동", "연어덮밥", "가츠동", "오코노미야키", "타코야키", "야끼토리", "카레", "샤브샤브", "사케동"],
            etc: ["쌀국수", "타코", "팟타이", "케밥", "커리", "반미", "퀘사디아", "마라샹궈"]
        };

        let selectedFood = "";

        const screen1 = document.getElementById('screen1');
        const screen2 = document.getElementById('screen2');
        const btnRecommend = document.getElementById('btn-recommend');
        const giftBox = document.getElementById('gift-box');
        const resultText = document.getElementById('result-text');
        const guideText = document.getElementById('guide-text');

        // 추천 버튼 클릭 이벤트
        btnRecommend.addEventListener('click', () => {
            const checkboxes = document.querySelectorAll('.checkbox-container input[type="checkbox"]:checked');
            
            // 아무것도 선택 안 했을 때 (커스텀 경고창 띄우기)
            if (checkboxes.length === 0) {
                document.getElementById('custom-alert').style.display = 'block';
                return;
            }

            // 선택된 카테고리 음식들 다 끌어모으기
            let pool = [];
            checkboxes.forEach(cb => {
                pool = pool.concat(menus[cb.value]);
            });

            // 랜덤으로 하나 뽑기
            const randomIndex = Math.floor(Math.random() * pool.length);
            selectedFood = pool[randomIndex];

            // 화면 전환 (1번 가리고 2번 보여줌)
            screen1.style.display = 'none';
            screen2.style.display = 'flex';
        });

        // 선물상자 클릭 이벤트
        giftBox.addEventListener('click', () => {
            // 상자 숨기기
            giftBox.style.display = 'none';
            guideText.style.display = 'none';

            // 결과 텍스트 보여주기 및 애니메이션 적용
            resultText.style.display = 'block';
            resultText.innerHTML = `짜잔!<br>오늘 저녁은<br><span style="color:yellow; font-size: 5rem;">[${selectedFood}]</span><br>ㅋㅋㅋㅋㅋ`;
            resultText.classList.add('spin-zoom', 'blink'); // 정신없는 애니메이션 추가

            // 킹받는 이모지 파티 (Confetti)
            createConfetti();
        });

        // 어지러운 이모지 파티 효과 함수
        function createConfetti() {
            const emojis = ['🤡', '💩', '🎉', '🍗', '🍕', '🔥', '🤪'];
            
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.classList.add('confetti');
                    // 랜덤 이모지 선택
                    confetti.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                    // 랜덤 가로 위치
                    confetti.style.left = Math.random() * 100 + 'vw';
                    // 랜덤 크기
                    confetti.style.fontSize = (Math.random() * 40 + 20) + 'px';
                    // 랜덤 떨어지는 속도
                    confetti.style.animationDuration = (Math.random() * 2 + 1) + 's';
                    
                    document.body.appendChild(confetti);
                    
                    // 끝나면 지우기
                    setTimeout(() => {
                        confetti.remove();
                    }, 3000);
                }, i * 50); // 약간의 시간차를 두고 떨어지게
            }
        }
    </script>
</body>
</html>
